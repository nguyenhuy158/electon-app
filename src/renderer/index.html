<!doctype html>
<html>
  <head>
    <title>QuickClip Sync</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: var(--color-hairline, #d1d1d1);
        border-radius: 2px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: var(--color-mute, #9ca3af);
      }
    </style>
  </head>
  <body class="h-screen flex flex-col overflow-hidden bg-canvas text-body font-sans">
    <!-- Header -->
    <header class="flex items-center justify-between px-6 py-4 bg-canvas/80 backdrop-blur-md sticky top-0 z-20 border-b border-hairline shrink-0">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 bg-accent rounded-md flex items-center justify-center text-white">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
        </div>
        <h1 class="text-sm font-semibold tracking-tight">QuickClip</h1>
      </div>
      
      <button
        id="settings-toggle"
        class="p-2 hover:bg-surface-soft rounded-full transition-all cursor-pointer text-mute hover:text-accent"
        title="Settings"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
    </header>

    <main class="flex-1 min-h-0 relative">
      <!-- History View -->
      <div id="history-view" class="flex flex-col h-full p-4">
        <div class="relative mb-4 shrink-0">
          <div class="absolute inset-y-0 left-3 flex items-center pointer-events-none text-mute">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </div>
          <input
            type="text"
            id="search-input"
            placeholder="Search clipboard..."
            class="input-field pl-10"
          />
        </div>
        <div id="history-list" class="space-y-2 overflow-y-auto pr-1 custom-scrollbar flex-1"></div>
      </div>

      <!-- Settings View -->
      <div id="settings-view" class="hidden absolute inset-0 bg-canvas z-10 flex flex-col p-6">
        <div class="flex items-center gap-3 mb-8">
          <button id="settings-back" class="p-2 hover:bg-surface-soft rounded-full transition-colors cursor-pointer text-mute">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          </button>
          <h2 class="text-lg font-semibold">Settings</h2>
        </div>
        
        <div class="space-y-6 overflow-y-auto pr-2 custom-scrollbar">
          <section class="space-y-3">
            <h3 class="text-[11px] font-bold uppercase text-mute tracking-wider px-1">Account</h3>
            <div class="bg-surface-soft p-4 rounded-xl border border-hairline">
              <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 bg-canvas rounded-full flex items-center justify-center border border-hairline text-mute">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </div>
                <div>
                  <p class="text-sm font-semibold" id="user-email">Guest User</p>
                  <p class="text-xs text-mute" id="sync-status">Local storage only</p>
                </div>
              </div>
              <button id="auth-trigger-btn" class="btn-primary w-full shadow-sm">
                Sign In to Sync
              </button>
              <button id="logout-btn" class="btn-primary w-full hidden bg-white !text-danger border border-danger/20 hover:bg-danger/5">
                Sign Out
              </button>
            </div>
          </section>

          <section class="space-y-3">
            <h3 class="text-[11px] font-bold uppercase text-mute tracking-wider px-1">Global Shortcut</h3>
            <div class="flex gap-2">
              <input type="text" id="shortcut-input" class="input-field !m-0" placeholder="e.g. Cmd+Shift+V" />
              <button id="save-shortcut-btn" class="btn-primary px-4 shrink-0">Save</button>
            </div>
            <p id="shortcut-status" class="text-[11px] h-4 px-1"></p>
          </section>

          <section class="pt-4 border-t border-hairline">
            <h3 class="text-[11px] font-bold uppercase text-mute tracking-wider px-1 mb-3">Keyboard Shortcuts</h3>
            <div class="grid grid-cols-2 gap-x-8 gap-y-2 px-1">
              <div class="flex justify-between text-xs">
                <span class="text-mute">Search</span>
                <kbd class="bg-surface-soft px-1.5 py-0.5 rounded border border-hairline font-mono text-[10px]">/</kbd>
              </div>
              <div class="flex justify-between text-xs">
                <span class="text-mute">Select</span>
                <kbd class="bg-surface-soft px-1.5 py-0.5 rounded border border-hairline font-mono text-[10px]">1-9</kbd>
              </div>
              <div class="flex justify-between text-xs">
                <span class="text-mute">Navigate</span>
                <kbd class="bg-surface-soft px-1.5 py-0.5 rounded border border-hairline font-mono text-[10px]">j / k</kbd>
              </div>
              <div class="flex justify-between text-xs">
                <span class="text-mute">Copy</span>
                <kbd class="bg-surface-soft px-1.5 py-0.5 rounded border border-hairline font-mono text-[10px]">Enter</kbd>
              </div>
            </div>
          </section>
        </div>
      </div>

      <!-- Auth Form -->
      <div id="auth-form" class="hidden absolute inset-0 bg-canvas z-30 flex flex-col p-6">
        <div class="flex items-center gap-3 mb-8">
          <button id="auth-back" class="p-2 hover:bg-surface-soft rounded-full transition-colors cursor-pointer text-mute">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          </button>
          <h2 id="form-title" class="text-lg font-semibold">Sign In</h2>
        </div>
        
        <div class="space-y-4">
          <div>
            <label class="text-[11px] font-bold uppercase text-mute tracking-wider px-1 mb-1 block">Email</label>
            <input type="email" id="email" placeholder="name@example.com" required class="input-field !m-0" />
          </div>
          <div>
            <label class="text-[11px] font-bold uppercase text-mute tracking-wider px-1 mb-1 block">Password</label>
            <input type="password" id="password" placeholder="••••••••" required class="input-field !m-0" />
          </div>
          <button id="submit-btn" class="btn-primary w-full mt-2 shadow-md">Continue</button>
          
          <button id="toggle-link" class="w-full text-center text-xs text-mute hover:text-accent transition-colors py-2">
            Don't have an account? <span class="font-semibold text-accent">Sign Up</span>
          </button>
        </div>
        
        <div id="status" class="mt-4 p-3 rounded-xl hidden text-xs text-center font-medium bg-danger/5 text-danger border border-danger/10"></div>
      </div>
    </main>

    <script>
      window.api = {
        onHistoryUpdate: (cb) => { window.onHistoryUpdate = cb; },
        onFocusSearch: (cb) => { window.onFocusSearch = cb; },
        getHistory: () => window.pywebview ? window.pywebview.api.get_history() : Promise.resolve([]),
        getShortcut: () => window.pywebview ? window.pywebview.api.get_shortcut() : Promise.resolve(''),
        updateShortcut: (s) => window.pywebview ? window.pywebview.api.update_shortcut(s) : Promise.resolve({ success: true }),
        copyToClipboard: (t) => { if (window.pywebview) window.pywebview.api.copy_to_clipboard(t); },
        login: (d) => window.pywebview ? window.pywebview.api.login(d) : Promise.resolve({ success: true }),
        register: (d) => window.pywebview ? window.pywebview.api.register(d) : Promise.resolve({ success: true }),
        logout: () => window.pywebview ? window.pywebview.api.logout() : Promise.resolve(true)
      };

      window.addEventListener('pywebviewready', () => {
        const pyApi = window.pywebview.api;
        const oldApi = window.api;
        window.api = {
          ...pyApi,
          onHistoryUpdate: oldApi.onHistoryUpdate,
          onFocusSearch: oldApi.onFocusSearch,
          getHistory: () => pyApi.get_history(),
          getShortcut: () => pyApi.get_shortcut(),
          updateShortcut: (s) => pyApi.update_shortcut(s),
          copyToClipboard: (t) => {
            pyApi.copy_to_clipboard(t);
            pyApi.hide();
          },
          login: (d) => pyApi.login(d),
          register: (d) => pyApi.register(d),
          logout: () => pyApi.logout()
        };
        loadData();
      });

      let isLogin = true,
        currentUser = null,
        fullHistory = [],
        filteredHistory = [],
        localSelectedIndex = 0;
      const historyView = document.getElementById('history-view'),
        settingsView = document.getElementById('settings-view'),
        authForm = document.getElementById('auth-form');
      const settingsToggle = document.getElementById('settings-toggle'),
        settingsBack = document.getElementById('settings-back'),
        authBack = document.getElementById('auth-back');
      const formTitle = document.getElementById('form-title'),
        submitBtn = document.getElementById('submit-btn'),
        toggleLink = document.getElementById('toggle-link'),
        status = document.getElementById('status');
      const authTriggerBtn = document.getElementById('auth-trigger-btn'),
        logoutBtn = document.getElementById('logout-btn'),
        userEmailDisplay = document.getElementById('user-email'),
        syncStatusDisplay = document.getElementById('sync-status');
      const shortcutInput = document.getElementById('shortcut-input'),
        saveShortcutBtn = document.getElementById('save-shortcut-btn'),
        shortcutStatus = document.getElementById('shortcut-status');
      const historyList = document.getElementById('history-list'),
        searchInput = document.getElementById('search-input');

      const renderHistory = (filter = '') => {
        historyList.innerHTML = '';
        filteredHistory = fullHistory.filter((t) => 
          typeof t === 'string' && t.toLowerCase().includes(filter.toLowerCase())
        );
        if (fullHistory.length === 0) {
          historyList.innerHTML =
            '<div class="text-mute text-center py-8 text-[13px] italic">[History empty]</div>';
          return;
        }
        if (filteredHistory.length === 0) {
          historyList.innerHTML =
            '<div class="text-mute text-center py-8 text-[13px] italic">[No matches]</div>';
          return;
        }
        if (localSelectedIndex >= filteredHistory.length)
          localSelectedIndex = filteredHistory.length - 1;

        filteredHistory.forEach((text, i) => {
          const item = document.createElement('div'),
            isSel = i === localSelectedIndex;
          item.className = `p-3 bg-surface-card border rounded-sm cursor-pointer group transition-all flex items-start gap-3 ${isSel ? 'border-accent ring-1 ring-accent' : 'border-hairline hover:border-accent'}`;
          item.innerHTML = `
            <span class="text-[10px] ${isSel ? 'text-accent font-bold' : 'text-mute'} font-mono mt-0.5">${i + 1}</span>
            <div class="flex-1 min-w-0"><div class="text-[13px] ${isSel ? 'text-accent font-bold' : 'text-primary'} break-words whitespace-pre-wrap">${text.length > 100 ? text.substring(0, 97) + '...' : text}</div></div>
            <div class="text-[10px] ${isSel ? 'text-accent' : 'text-mute'} group-hover:text-accent font-mono mt-0.5">${isSel ? '►' : '↵'}</div>`;
          item.onclick = () => {
            localSelectedIndex = i;
            window.api.copyToClipboard(text);
          };
          historyList.appendChild(item);
          if (isSel) item.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        });
      };

      searchInput.oninput = (e) => {
        localSelectedIndex = 0;
        renderHistory(e.target.value);
      };

      document.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.activeElement !== searchInput) {
          e.preventDefault();
          searchInput.focus();
          return;
        }
        if (e.key === 'Escape') {
          if (document.activeElement === searchInput) searchInput.blur();
          else if (!authForm.classList.contains('hidden')) authBack.click();
          else if (!settingsView.classList.contains('hidden')) settingsBack.click();
          else {
            localSelectedIndex = -1;
            renderHistory(searchInput.value);
          }
          return;
        }
        if (e.key >= '1' && e.key <= '9' && !e.ctrlKey && !e.metaKey && !e.altKey) {
          const idx = parseInt(e.key) - 1;
          if (filteredHistory[idx]) window.api.copyToClipboard(filteredHistory[idx]);
          return;
        }
        if (document.activeElement !== searchInput) {
          if (e.key === 'j') {
            localSelectedIndex = (localSelectedIndex + 1) % (filteredHistory.length || 1);
            renderHistory(searchInput.value);
          } else if (e.key === 'k') {
            localSelectedIndex =
              localSelectedIndex <= 0 ? (filteredHistory.length || 1) - 1 : localSelectedIndex - 1;
            renderHistory(searchInput.value);
          } else if (e.key === 'Enter' && localSelectedIndex !== -1)
            window.api.copyToClipboard(filteredHistory[localSelectedIndex]);
        } else if (e.key === 'Enter' && filteredHistory.length > 0) {
          window.api.copyToClipboard(
            filteredHistory[localSelectedIndex === -1 ? 0 : localSelectedIndex]
          );
        }
      });

      settingsToggle.onclick = () => {
        historyView.classList.add('hidden');
        settingsView.classList.remove('hidden');
        settingsToggle.classList.add('hidden');
      };
      settingsBack.onclick = () => {
        settingsView.classList.add('hidden');
        historyView.classList.remove('hidden');
        settingsToggle.classList.remove('hidden');
      };
      authTriggerBtn.onclick = () => authForm.classList.remove('hidden');
      authBack.onclick = () => authForm.classList.add('hidden');

      window.api.onHistoryUpdate((h) => {
        fullHistory = h;
        renderHistory(searchInput.value);
      });
      window.api.onFocusSearch(() => {
        searchInput.focus();
        searchInput.select();
      });

      const loadData = async () => {
        try {
          const shortcut = await window.api.getShortcut();
          shortcutInput.value = typeof shortcut === 'string' ? shortcut : '';
          
          fullHistory = await window.api.getHistory();
          renderHistory();
        } catch (e) {
          console.error("Failed to load data:", e);
        }
      };
      loadData();

      saveShortcutBtn.onclick = async () => {
        const val = shortcutInput.value.trim();
        if (!val) return;
        saveShortcutBtn.disabled = true;
        shortcutStatus.innerText = 'Updating...';
        const res = await window.api.updateShortcut(val);
        shortcutStatus.innerText = res.success ? 'Updated!' : 'Error: ' + res.error;
        shortcutStatus.className =
          'text-[10px] mt-2 ' + (res.success ? 'text-success' : 'text-danger');
        setTimeout(() => {
          shortcutStatus.innerText = '';
          saveShortcutBtn.disabled = false;
        }, 2000);
      };

      logoutBtn.onclick = async () => {
        await window.api.logout();
        currentUser = null;
        userEmailDisplay.innerText = 'Guest';
        syncStatusDisplay.innerText = 'Offline mode: local storage';
        authTriggerBtn.classList.remove('hidden');
        logoutBtn.classList.add('hidden');
        loadData();
        settingsBack.click();
      };

      toggleLink.onclick = () => {
        isLogin = !isLogin;
        formTitle.innerText = isLogin ? 'Login' : 'Register';
        submitBtn.innerText = isLogin ? 'Login' : 'Register';
        toggleLink.innerText = isLogin ? '[+] No account? Register' : '[+] Have account? Login';
      };

      submitBtn.onclick = async () => {
        const email = document.getElementById('email').value,
          pass = document.getElementById('password').value;
        status.classList.remove('hidden');
        status.innerText = 'Processing...';
        const res = isLogin
          ? await window.api.login({ email, password: pass })
          : await window.api.register({ email, password: pass });
        if (res.success) {
          currentUser = res.user;
          authForm.classList.add('hidden');
          userEmailDisplay.innerText = res.user.email;
          syncStatusDisplay.innerText = 'Cloud sync active';
          authTriggerBtn.classList.add('hidden');
          logoutBtn.classList.remove('hidden');
          loadData();
        } else {
          status.innerText = 'Error: ' + res.error;
          status.classList.add('text-danger');
        }
      };
    </script>
  </body>
</html>
